name: GFO R0007 Pathfix Canary

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  pathfix-canary:
    if: github.event.issue.user.login == 'mohammadshortformeditor-source' && startsWith(github.event.issue.title, '[GFO-PATHFIX]')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout public runner shell
        uses: actions/checkout@v4
        with:
          ref: r0007-mission-controller-fix
          persist-credentials: false

      - name: Checkout private GREENFIELD canary
        uses: actions/checkout@v4
        with:
          repository: mohammadshortformeditor-source/greenfield-outreach
          ref: ccf0de6b1122cef398b57d2f53800e0c03a12946
          token: ${{ secrets.GREENFIELD_READ_TOKEN }}
          path: engine
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install canonical engine dependencies
        run: |
          python -m pip install --disable-pip-version-check -q ./engine
          python -m pip install --disable-pip-version-check -q 'psycopg[binary]>=3.2,<4'

      - name: Compile mission controller runner
        run: |
          python -m py_compile \
            ops/public_runner/mission_control.py \
            ops/public_runner/runner_once.py \
            ops/public_runner/resume_authority_once.py \
            ops/public_runner/resume_pathfix_canary.py

      - name: Resume through canonical bridge canary
        env:
          GFO_ENGINE_ROOT: engine
          GFO_RENDER_DB_BROKER_URL: https://hxmplpufcujfdaklvrjy.supabase.co/functions/v1/gfo-render-db-authority-r0007
          GFO_RENDER_DB_BROKER_TOKEN: ${{ secrets.GFO_DB_BROKER_TOKEN }}
          GFO_EXPECTED_ACTIVE_COMMIT: ccf0de6b1122cef398b57d2f53800e0c03a12946
          GFO_PUBLIC_TRIGGER_TITLE: ${{ github.event.issue.title }}
          GFO_RENDER_RUN_TIMEOUT_SECONDS: '1800'
        run: python ops/public_runner/resume_pathfix_canary.py

      - name: Close trigger issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close '${{ github.event.issue.number }}' --repo '${{ github.repository }}' || true
