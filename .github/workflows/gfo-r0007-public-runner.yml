name: GFO R0007 Public Runner

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: gfo-r0007-public-runner
  cancel-in-progress: false

jobs:
  execute-one:
    if: >-
      github.actor == 'mohammadshortformeditor-source' &&
      startsWith(github.event.issue.title, '[GFO-RUN]')
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout public runner shell
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout private GREENFIELD engine at pinned commit
        uses: actions/checkout@v4
        with:
          repository: mohammadshortformeditor-source/greenfield-outreach
          ref: 7c69f5ba8515dd8f04a84ffb81e34e0cffb930fd
          token: ${{ secrets.GREENFIELD_READ_TOKEN }}
          path: engine
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install canonical engine dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./engine "psycopg[binary]>=3.2,<4"

      - name: Execute pinned R0007 request
        env:
          GFO_ENGINE_ROOT: engine
          GFO_PUBLIC_TRIGGER_TITLE: ${{ github.event.issue.title }}
          GFO_RENDER_DB_BROKER_URL: https://hxmplpufcujfdaklvrjy.supabase.co/functions/v1/gfo-render-db-authority-r0007
          GFO_RENDER_DB_BROKER_TOKEN: ${{ secrets.GFO_DB_BROKER_TOKEN }}
          GFO_EXPECTED_ACTIVE_COMMIT: 7c69f5ba8515dd8f04a84ffb81e34e0cffb930fd
          GFO_EXPECTED_ACTIVE_TREE: 263b6c301353259383b640ba487df7bdb7428add
          GFO_FREE_TRANSPORT_HTTP_CACHE_MAX_ENTRIES: '1'
          GFO_FREE_TRANSPORT_ROUTE_HIT_CAP: '24'
          GFO_FREE_TRANSPORT_ENRICHMENT_WORKERS: '8'
          GFO_FREE_TRANSPORT_HTTP_TIMEOUT_SECONDS: '3.0'
          GFO_RENDER_RUN_TIMEOUT_SECONDS: '1800'
          GFO_RENDER_HEARTBEAT_SECONDS: '20'
          GFO_RENDER_STALE_FAIL_SECONDS: '180'
          GFO_RENDER_HEARTBEAT_DB_GRACE_SECONDS: '240'
        run: python ops/public_runner/runner_once.py

      - name: Close trigger issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: gh issue close "$ISSUE_NUMBER" --repo "$REPO" || true
