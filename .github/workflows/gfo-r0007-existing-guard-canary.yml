name: GFO R0007 Existing Guard Canary

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: gfo-r0007-existing-guard-canary
  cancel-in-progress: false

jobs:
  execute-existing-guard-canary:
    if: >-
      github.actor == 'mohammadshortformeditor-source' &&
      startsWith(github.event.issue.title, '[GFO-GUARD]')
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout public runner shell
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout private GREENFIELD bridge v5
        uses: actions/checkout@v4
        with:
          repository: mohammadshortformeditor-source/greenfield-outreach
          ref: 372ef98562ab8f3767a120c65aa92bcd5100af88
          token: ${{ secrets.GREENFIELD_READ_TOKEN }}
          path: engine
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install canonical engine dependencies
        run: |
          python -m pip install --disable-pip-version-check -q ./engine
          python -m pip install --disable-pip-version-check -q 'psycopg[binary]>=3.2,<4'

      - name: Execute fresh motor to four-source canary
        env:
          GFO_ENGINE_ROOT: engine
          GFO_PUBLIC_TRIGGER_TITLE: ${{ github.event.issue.title }}
          GFO_RENDER_DB_BROKER_URL: https://hxmplpufcujfdaklvrjy.supabase.co/functions/v1/gfo-render-db-authority-r0007
          GFO_RENDER_DB_BROKER_TOKEN: ${{ secrets.GFO_DB_BROKER_TOKEN }}
          GFO_EXPECTED_ACTIVE_COMMIT: cfd2385878cab6faf89cf895551edc0dacdf6303
          GFO_RENDER_RUN_TIMEOUT_SECONDS: '1800'
        run: python ops/public_runner/runner_existing_guard_once.py

      - name: Close trigger issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: gh issue close "$ISSUE_NUMBER" --repo "$REPO" || true
